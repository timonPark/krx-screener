# 1단계 필터 기준 (시세 기반, 모델 미사용). 첫 실행에서 후보가 50~100개 범위에 들어오는지
# 보고 숫자만 조정한다. 이 값은 백테스트가 아니라 "후보 수가 감당 가능한가"만 보고 정한
# 시작값이다.
filters:
  min_avg_trading_value_krw: 1_000_000_000   # 20거래일 평균 거래대금 하한 (10억 원)
  avg_trading_value_window: 20
  price_above_ma: [20, 60]                    # 종가가 이 이동평균선들 위에 있어야 함
  rsi_period: 14
  rsi_max: 70                                 # RSI 가 이 값 미만이어야 함 (과열 제외)

# 유니버스 제외 규칙은 전종목 목록의 종류별 개수를 확인한 뒤 확정한다.
# (기본 가정: 우선주·스팩·관리종목·거래정지·신규상장 60거래일 미만 제외)
