# krx-screener 설정. 필터 숫자는 첫 실행에서 후보가 50~100개 범위에 들어오는지 보고 조정한다.
# 이 값은 백테스트가 아니라 "후보 수가 감당 가능한가"만 보고 정한 시작값이다.

# 유니버스: true 인 종류는 스크리닝에서 제외한다. false 인 종류는 제외하지 않고
# candidates.csv 에 표시 컬럼(is_caution, is_foreign)만 붙여 보여준다.
# 종목 종류(소속부·상장일)는 FinanceDataReader 가 주는 조회 시점 기준이다.
universe:
  exclude:
    preferred: true     # 우선주 (종목코드 끝자리가 0 이 아닌 종목)
    spac: true          # 스팩
    managed: true       # 관리종목
    zero_volume: true   # 기준일 거래량 0 또는 시세 없음 (거래정지 의심)
    new_listing: true   # 신규상장 60거래일 미만 (평일 수로 근사)
    reit: true          # 리츠 (종목명에 "리츠")
    caution: false      # 투자주의환기종목 — 표시만
    foreign: false      # 외국기업 — 표시만

# 1단계 필터 (시세 기반, 모델 미사용). 네 조건을 모두 만족해야 후보가 된다.
filters:
  # 거래대금은 종가 × 거래량으로 근사한 값이다 (실제 거래대금이 아님).
  min_avg_trading_value_krw: 1_000_000_000   # 20거래일 평균 거래대금(근사) 하한 (10억 원)
  avg_trading_value_window: 20
  price_above_ma: [20, 60]                    # 종가가 이 이동평균선들 위에 있어야 함
  rsi_period: 14
  rsi_max: 70                                 # RSI 가 이 값 미만이어야 함 (과열 제외)
